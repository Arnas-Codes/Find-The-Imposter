      const PRESETS = {
        arnas: {
          color: "#c41e3a",
          bg: "#2a0810",
          img: "imageA.png",
          label: "The Firestarter",
        },
        suchi: {

        },

        },

        },
      };

      const uid = () => Math.random().toString(36).slice(2, 9);
      const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
      const shuffle = (arr) => {
        const a = [...arr];
        for (let i = a.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
      };
      const partial = (w) => {
        const c = [...w];
        const hide = Math.ceil(c.length * 0.45);
        const idx = shuffle([...Array(c.length).keys()]).slice(0, hide);
        return c.map((ch, i) => (idx.includes(i) ? "_" : ch)).join("");
      };
      const presetKey = (name) => name.toLowerCase().trim();
      const isPreset = (name) => !!PRESETS[presetKey(name)];
      const presetOf = (name) => PRESETS[presetKey(name)];

      const PHASES = {
        REVEAL: "reveal",
        TURNS: "turns",
        VOTE: "vote",
        RESULTS: "results",
        GAMEOVER: "gameover",
      };

      function buildRound(players, config, chaosConfig, roundNum) {
        const isChaos = config.mode === "chaos";
        const active = {};
        if (isChaos) {
          Object.entries(chaosConfig).forEach(([k, v]) => {
            if (!v.enabled) return;
            active[k] =
              v.mode === "manual"
                ? v.value
                : Math.random() > 0.42
                  ? v.value
                  : null;
          });
        }
        let impCount = config.numImposters || 1;
        if (isChaos && active.multipleImposters)
          impCount = Math.min(
            +active.multipleImposters,
            Math.max(1, Math.floor(players.length * 0.45)),
          );
        impCount = Math.min(
          impCount,
          Math.max(1, Math.floor(players.length * 0.45)),
        );

        let catKey = config.category || "common";
        if (isChaos && active.categoryRandom)
          catKey = pick(["common", "travel", "places", "food"]);
        const pool =
          catKey === "random"
            ? [...WORDS.common, ...WORDS.travel, ...WORDS.places, ...WORDS.food]
            : WORDS[catKey] || WORDS.common;
        const word = pick(pool);

        const shuffled = shuffle([...players]);
        const imposterIds = new Set(
          shuffled.slice(0, impCount).map((p) => p.id),
        );
        const roles = {};
        players.forEach((p) => {
          roles[p.id] = imposterIds.has(p.id) ? "imposter" : "civilian";
        });

        const impWordType =
          isChaos && active.imposterWordType ? active.imposterWordType : "none";
        const revealStyle =
          isChaos && active.wordReveal ? active.wordReveal : "normal";
        // New: civilian confusion feature
        const civConfusion =
          isChaos && active.civilianConfusion
            ? active.civilianConfusion
            : "none";

        const playerWords = {};
        players.forEach((p) => {
          if (imposterIds.has(p.id)) {
            if (impWordType === "real") playerWords[p.id] = word;
            else if (impWordType === "fake")
              playerWords[p.id] = pick(pool.filter((w) => w !== word)) || word;
            else playerWords[p.id] = null;
          } else {
            // Apply civilian confusion (10% chance per civilian unless manual)
            let confusionTriggered = false;
            if (civConfusion !== "none") {
              const chance = civConfusion === "force" ? 1 : 0.1;
              confusionTriggered = Math.random() < chance;
            }
            if (confusionTriggered && civConfusion === "wrong_word") {
              playerWords[p.id] = pick(pool.filter((w) => w !== word)) || word;
            } else if (confusionTriggered && civConfusion === "no_word") {
              playerWords[p.id] = null;
            } else if (confusionTriggered) {
              // mixed mode: randomly pick wrong word or no word
              playerWords[p.id] =
                Math.random() < 0.5
                  ? pick(pool.filter((w) => w !== word)) || word
                  : null;
            } else if (revealStyle === "partial") {
              playerWords[p.id] = partial(word);
            } else if (revealStyle === "disguised") {
              playerWords[p.id] = `The ${word.toLowerCase()} in question`;
            } else {
              playerWords[p.id] = word;
            }
          }
        });

        const turnOrder =
          isChaos && active.turnOrder === "shuffled"
            ? shuffle(players.map((p) => p.id))
            : players.map((p) => p.id);
        return {
          round: roundNum,
          totalRounds: config.totalRounds || 3,
          word,
          roles,
          playerWords,
          turnOrder,
          imposterIds: [...imposterIds],
          impWordType,
          revealStyle,
          civConfusion,
          activeFeatures: active,
          phase: PHASES.REVEAL,
          revealIdx: 0,
          turnIdx: 0,
        };
      }

      function computeOutcome(players, gameState, votes) {
        const tally = {};
        players.forEach((p) => {
          tally[p.id] = 0;
        });
        Object.values(votes).forEach((tid) => {
          if (tally[tid] !== undefined) tally[tid]++;
        });
        const maxV = Math.max(...Object.values(tally), 0);
        const eliminated = Object.keys(tally).filter(
          (id) => tally[id] === maxV && maxV > 0,
        );
        const { imposterIds } = gameState;
        const caught = imposterIds.filter((id) => eliminated.includes(id));
        const escaped = imposterIds.filter((id) => !eliminated.includes(id));
        const civWin = caught.length > 0;
        const scoreDeltas = {};
        players.forEach((p) => {
          scoreDeltas[p.id] = 0;
        });
        if (civWin) {
          players.forEach((p) => {
            if (gameState.roles[p.id] === "civilian") scoreDeltas[p.id] += 2;
          });
          Object.entries(votes).forEach(([vId, tId]) => {
            if (imposterIds.includes(tId)) scoreDeltas[vId] += 1;
          });
        } else {
          imposterIds.forEach((id) => {
            scoreDeltas[id] += 3;
          });
        }
        return { tally, eliminated, caught, escaped, civWin, scoreDeltas };
      }

                <Btn

                  onClick={onRevealNow}
                >
                  🎭 Skip to Reveal Imposter
                </Btn>
                <Btn
                  variant="danger"
                  style={{ width: "100%", fontSize: 15, padding: "13px 20px" }}
                  onClick={onLeave}
                >
                  🏠 Leave Game

      /* ── INSTANT REVEAL SCREEN ── */
      function InstantRevealScreen({
        gameState,
        players,
        scores,
        onNextRound,
        onEndGame,
        onHome,
        isLastRound,
      }) {
        const imposters = gameState.imposterIds
          .map((id) => players.find((p) => p.id === id))
          .filter(Boolean);
        const civilians = players.filter(
          (p) => gameState.roles[p.id] === "civilian",
        );
        return (
          <div
            className="screen bg-mesh"
            style={{
              display: "flex",
              flexDirection: "column",
              alignItems: "center",
              justifyContent: "center",
              padding: "32px 24px",
              minHeight: "100%",
            }}
          >
            <div style={{ width: "100%", maxWidth: 340 }}>
              <div
                className="anim-pop"

      /* ── SETUP ── */
      function SetupScreen({
        players,
        setPlayers,
        config,
        setConfig,
        onBack,
        onStartGame,
        onChaosConfig,
      }) {
        const [newName, setNewName] = useState("");
        const [editId, setEditId] = useState(null);
        const [editVal, setEditVal] = useState("");
        const [err, setErr] = useState("");

        const addPlayer = () => {
          const t = newName.trim();
          if (!t) return;
          if (players.some((p) => p.name.toLowerCase() === t.toLowerCase())) {
            setErr("Name already exists");
            return;
          }
          if (players.length >= 12) {
            setErr("Maximum 12 players");
            return;
          }
          setPlayers((p) => [...p, { id: uid(), name: t }]);
          setNewName("");
          setErr("");
        };
        const removePlayer = (id) =>
          setPlayers((p) => p.filter((x) => x.id !== id));
        const startEdit = (p) => {
          setEditId(p.id);
          setEditVal(p.name);
        };
        const saveEdit = () => {
          const t = editVal.trim();
          if (
            t &&
            !players.some(
              (p) =>
                p.id !== editId && p.name.toLowerCase() === t.toLowerCase(),
            )
          )
            setPlayers((p) =>
              p.map((x) => (x.id === editId ? { ...x, name: t } : x)),
            );
          setEditId(null);
        };

        const maxImp = Math.max(1, Math.floor(players.length * 0.4));
        const safeNumImposters = Math.min(config.numImposters, maxImp);
        const canStart = players.length >= 3;

                  <div>

                    <input

                        setConfig((c) => ({
                          ...c,
                          totalRounds: +e.target.value,
                        }))
                      }
                    />
                  </div>
                </div>

              {config.mode === "chaos" && (

                  <button

                        🌪️ Configure Chaos Features

                      <div
                        style={{
                          fontSize: 12,
                          color: "var(--txt3)",
                          marginTop: 3,

                    <span style={{ color: "var(--red)", fontSize: 20 }}>→</span>

                    className="card"

                    <label

                        fontSize: 13,
                        color: "var(--txt2)",

                        justifyContent: "space-between",
                        marginBottom: 8,

                    >
                      Rounds{" "}
                      <span style={{ color: "var(--gold)", fontWeight: 600 }}>
                        {config.totalRounds}
                      </span>
                    </label>
                    <input
                      type="range"
                      min={1}
                      max={10}
                      value={config.totalRounds}
                      className="range-inp"
                      onChange={(e) =>
                        setConfig((c) => ({
                          ...c,
                          totalRounds: +e.target.value,
                        }))
                      }
                    />
                  </div>
                </>
              )}

              <div className="divider">
                <span>Players</span>
              </div>
              <div
                style={{
                  display: "flex",
                  flexDirection: "column",
                  gap: 8,
                  marginBottom: 12,
                }}
              >
                {players.map((p, i) => (
                  <div
                    key={p.id}
                    className="card anim-up"
                    style={{
                      padding: "10px 14px",
                      display: "flex",
                      alignItems: "center",
                      gap: 10,
                      animationDelay: `${i * 0.04}s`,
                    }}
                  >
                    <Avatar name={p.name} size={40} />
                    {editId === p.id ? (
                      <input
                        className="inp"
                        value={editVal}
                        autoFocus
                        style={{ flex: 1, padding: "8px 12px", fontSize: 15 }}
                        onChange={(e) => setEditVal(e.target.value)}
                        onKeyDown={(e) => {
                          if (e.key === "Enter") saveEdit();

                      <div style={{ flex: 1 }}>
                        <span

                            fontWeight: 600,
                            color: "var(--txt)",

                        style={{

                          border: "none",
                          cursor: "pointer",
                          color: "var(--txt3)",
                          fontSize: 14,
                          padding: 4,

                    disabled={!newName.trim()}

                disabled={!canStart}
              >

              </Btn>
            </div>
          </div>
        );

            label: "Multiple Imposters",
            desc: "Allow 2–3 imposters per round",
            values: [2, 3],
            valLabel: (v) => `${v} imposters`,
          },
          {
            key: "imposterWordType",
            icon: "🎭",
            label: "Imposter Word",
            desc: "What imposters see",
            values: ["real", "fake", "none"],
            valLabel: (v) =>
              ({ real: "Same word", fake: "Fake word", none: "No word" })[v],
          },
          {
            key: "civilianConfusion",
            icon: "🌀",
            label: "Civilian Confusion",
            desc: "10% chance a civilian gets a wrong word or no word — sows doubt among innocents!",

      /* ── VOTE SCREEN ── */
      function VoteScreen({ gameState, players, onVote, voterIdx, onExit }) {
        const [selected, setSelected] = useState(null);
        const [locked, setLocked] = useState(false);
        const [showExitModal, setShowExitModal] = useState(false);
        const voterId = gameState.turnOrder[voterIdx];
        const voter = players.find((p) => p.id === voterId);
        const isLast = voterIdx === gameState.turnOrder.length - 1;
        const nextVoter = !isLast
          ? players.find((p) => p.id === gameState.turnOrder[voterIdx + 1])
          : null;
        const candidates = players.filter((p) => p.id !== voterId);
        useEffect(() => {
          setSelected(null);
          setLocked(false);
        }, [voterIdx]);
        const handleLock = () => {
          if (!selected) return;
          setLocked(true);
          setTimeout(() => onVote(voterId, selected), 700);
        };

        if (locked)
          return (
            <div
              className="screen"
              style={{
                display: "flex",
                alignItems: "center",
                justifyContent: "center",
                background: "var(--bg)",
              }}
            >
              <div className="anim-pop" style={{ textAlign: "center" }}>
                <div style={{ fontSize: 60, marginBottom: 16 }}>🔒</div>
                <h2
                  className="cinzel"
                  style={{ fontSize: 20, color: "var(--txt)", marginBottom: 8 }}
                >
                  Vote Locked In
                </h2>
                <p style={{ color: "var(--txt3)", fontSize: 14 }}>
                  {isLast
                    ? "Tallying all votes..."
                    : `Pass device to ${nextVoter?.name}`}
                </p>
              </div>
            </div>
          );

        return (
          <div
            className="screen"
            style={{
              display: "flex",
              flexDirection: "column",
              background: "var(--bg)",
            }}
          >
            {showExitModal && (
              <ExitModal
                onKeepPlaying={() => setShowExitModal(false)}
                onRevealNow={() => onExit("reveal")}
                onLeave={() => onExit("leave")}
              />
            )}

            <div
              style={{
                padding: "14px 20px",
                borderBottom: "1px solid var(--bdr)",
                flexShrink: 0,
              }}
            >
              <div
                style={{
                  display: "flex",
                  alignItems: "center",
                  justifyContent: "space-between",
                  marginBottom: 10,
                }}
              >
                <span className="badge badge-gray">
                  Voter {voterIdx + 1}/{gameState.turnOrder.length}

                <span className="badge badge-red">Voting Phase</span>
                <button
                  onClick={() => setShowExitModal(true)}
                  style={{
                    background: "rgba(255,255,255,0.06)",
                    border: "1px solid var(--bdr)",
                    borderRadius: 8,
                    color: "var(--txt3)",
                    fontSize: 12,
                    fontFamily: "Rajdhani,sans-serif",
                    fontWeight: 600,
                    cursor: "pointer",
                    padding: "5px 10px",

                  ✕ Exit
                </button>
              </div>
              <ProgressBar
                value={voterIdx}
                max={gameState.turnOrder.length}
                color="red"
              />
            </div>
            <div style={{ flex: 1, overflowY: "auto", padding: "20px 20px" }}>
              <div style={{ maxWidth: 340, margin: "0 auto" }}>
                <div
                  style={{ textAlign: "center", marginBottom: 24 }}

      /* ── ROOT APP ── */
      function App() {
        useEffect(() => {
          if (document.getElementById("fti-css")) return;
          const el = document.createElement("style");
          el.id = "fti-css";
          el.textContent = CSS;
          document.head.appendChild(el);
        }, []);

        const [page, setPage] = useState("home");
        const [players, setPlayers] = useState([
          { id: uid(), name: "Arnas" },
          { id: uid(), name: "Suchi" },
          { id: uid(), name: "Utsab" },
          { id: uid(), name: "Ayntika" },
        ]);
        const [config, setConfig] = useState({
          mode: "normal",
          numImposters: 1,
          category: "common",
          totalRounds: 3,
        });
        const [chaosConfig, setChaosConfig] = useState({
          multipleImposters: { enabled: false, mode: "random", value: 2 },
          imposterWordType: { enabled: false, mode: "random", value: "fake" },
          civilianConfusion: { enabled: false, mode: "random", value: "mixed" },
          wordReveal: { enabled: false, mode: "random", value: "partial" },
          turnOrder: { enabled: false, mode: "random", value: "shuffled" },
          votingTieBreak: { enabled: false, mode: "random", value: "random" },
          categoryRandom: { enabled: false, mode: "random", value: true },
        });
        const [gameState, setGameState] = useState(null);
        const [scores, setScores] = useState({});
        const [votes, setVotes] = useState({});
        const [voterIdx, setVoterIdx] = useState(0);

        const startGame = useCallback(() => {
          const init = {};
          players.forEach((p) => {
            init[p.id] = 0;
          });
          setScores(init);
          setVotes({});
          setVoterIdx(0);
          const maxImp = Math.max(1, Math.floor(players.length * 0.4));
          const safeConfig = {
            ...config,
            numImposters: Math.min(config.numImposters, maxImp),
          };
          const round = buildRound(players, safeConfig, chaosConfig, 1);
          setGameState(round);
          setPage("game");
        }, [players, config, chaosConfig]);

        const advanceReveal = useCallback(() => {
          setGameState((prev) => {
            if (!prev) return prev;
            const nextIdx = prev.revealIdx + 1;
            if (nextIdx >= prev.turnOrder.length)
              return { ...prev, phase: PHASES.TURNS, turnIdx: 0 };
            return { ...prev, revealIdx: nextIdx };
          });
        }, []);

        const nextTurn = useCallback(() => {
          setGameState((prev) => ({ ...prev, turnIdx: prev.turnIdx + 1 }));
        }, []);
        const endTurns = useCallback(() => {
          setVotes({});
          setVoterIdx(0);
          setGameState((prev) => ({ ...prev, phase: PHASES.VOTE }));
        }, []);

        const handleVote = useCallback(
          (voterId, targetId) => {
            setVotes((prev) => {
              const newVotes = { ...prev, [voterId]: targetId };
              const nextIdx = voterIdx + 1;
              if (nextIdx >= (gameState?.turnOrder?.length || 0)) {
                const { scoreDeltas } = computeOutcome(
                  players,
                  gameState,
                  newVotes,
                );
                setTimeout(() => {
                  setScores((s) => {
                    const u = { ...s };
                    Object.entries(scoreDeltas).forEach(([id, d]) => {
                      u[id] = (u[id] || 0) + d;
                    });
                    return u;
                  });
                  setGameState((g) =>
                    g ? { ...g, phase: PHASES.RESULTS } : g,
                  );
                }, 0);
              } else {
                setTimeout(() => setVoterIdx(nextIdx), 0);
              }
              return newVotes;
            });
          },
          [voterIdx, gameState, players],
        );

        const nextRound = useCallback(() => {
          const maxImp = Math.max(1, Math.floor(players.length * 0.4));
          const safeConfig = {
            ...config,
            numImposters: Math.min(config.numImposters, maxImp),
          };
          const round = buildRound(
            players,
            safeConfig,
            chaosConfig,
            (gameState?.round || 0) + 1,
          );
          setVotes({});
          setVoterIdx(0);
          setGameState(round);
        }, [gameState, players, config, chaosConfig]);

        const endGame = useCallback(() => {
          setGameState((g) => (g ? { ...g, phase: PHASES.GAMEOVER } : g));
        }, []);
        const resetToHome = useCallback(() => {
          setGameState(null);
          setVotes({});
          setScores({});
          setPage("home");
        }, []);

        const handleGameExit = useCallback(
          (action) => {
            if (action === "reveal")
              setGameState((g) => (g ? { ...g, phase: "instant_reveal" } : g));
            else resetToHome();
          },
          [resetToHome],
        );

        const isLastRound = gameState
          ? gameState.round >= (config.totalRounds || 3)
          : false;

        return (
          <div className="game-root">
            {page === "home" && (
              <HomeScreen
                onStart={() => setPage("setup")}
                onSettings={() => setPage("settings")}
              />
            )}
            {page === "settings" && (
              <SettingsScreen onBack={() => setPage("home")} />
            )}
            {page === "setup" && (
              <SetupScreen
                players={players}
                setPlayers={setPlayers}
                config={config}
                setConfig={setConfig}
                onBack={() => setPage("home")}
                onStartGame={startGame}
                onChaosConfig={() => setPage("chaos-config")}
              />
            )}
            {page === "chaos-config" && (
              <ChaosConfigScreen
                chaosConfig={chaosConfig}
                setChaosConfig={setChaosConfig}
                onBack={() => setPage("setup")}
              />
            )}
            {page === "game" && gameState && (
              <>
                {gameState.phase === PHASES.GAMEOVER && (
                  <GameOverScreen
                    players={players}
                    scores={scores}
                    onPlayAgain={() => setPage("setup")}
                    onHome={resetToHome}
                  />
                )}
                {gameState.phase === PHASES.REVEAL && (
                  <RevealScreen
                    gameState={gameState}
                    players={players}
                    onNext={advanceReveal}
                    onExit={handleGameExit}
                  />
                )}
                {gameState.phase === PHASES.TURNS && (
                  <TurnsScreen
                    gameState={gameState}
                    players={players}
                    onNext={nextTurn}
                    onEnd={endTurns}
                    onExit={handleGameExit}
                  />
                )}
                {gameState.phase === PHASES.VOTE && (
                  <VoteScreen
                    gameState={gameState}
                    players={players}
                    onVote={handleVote}
                    voterIdx={voterIdx}
                    onExit={handleGameExit}
                  />
                )}
                {gameState.phase === PHASES.RESULTS && (
                  <ResultsScreen
                    gameState={gameState}
                    players={players}
                    votes={votes}
                    scores={scores}
                    isLastRound={isLastRound}
                    onNextRound={nextRound}
                    onEndGame={endGame}
                  />
                )}
                {gameState.phase === "instant_reveal" && (
                  <InstantRevealScreen
                    gameState={gameState}
                    players={players}
                    scores={scores}
                    isLastRound={isLastRound}
                    onNextRound={nextRound}
                    onEndGame={endGame}
                    onHome={resetToHome}
                  />
                )}
              </>
            )}
          </div>
        );
      }

      const root = ReactDOM.createRoot(document.getElementById("root"));
      root.render(<App />);
    </script>
  </body>
</html>
